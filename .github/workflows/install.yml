name: Install and run the Blyx tools on Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install Scoop on the disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
          Invoke-WebRequest 'https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1' -OutFile $installer
          $dest = Join-Path $env:RUNNER_TEMP 'scoop'
          & $installer -RunAsAdmin -ScoopDir $dest
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Scoop' }
          "SCOOP=$dest" | Out-File $env:GITHUB_ENV -Append
          (Join-Path $dest 'shims') | Out-File $env:GITHUB_PATH -Append
      - name: Install from the bucket and verify the command shims
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          scoop bucket add blyx https://github.com/Rahulchaube1/scoop-blyx
          if ($LASTEXITCODE -ne 0) { throw 'Could not add the bucket' }
          $bucket = Join-Path $env:SCOOP 'buckets/blyx'
          git -C $bucket fetch --no-tags $env:GITHUB_WORKSPACE HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the manifests under test' }
          git -C $bucket checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not select the manifests under test' }
          scoop install blyx/blyx blyx/blyxtorch blyx/linearfit blyx/residualwatch blyx/modelgate
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the Blyx manifests' }
          if ((blyxc --version) -ne 'blyxc 0.2.1') { throw 'Incorrect compiler version' }
          $data = Join-Path (scoop prefix linearfit) 'fixtures/line.csv'
          $out = linearfit $data --predict 5
          if ($LASTEXITCODE -ne 0 -or ($out | ConvertFrom-Json).prediction -ne 11) { throw 'Regression prediction failed' }
          $data = Join-Path (scoop prefix residualwatch) 'fixtures/shift.csv'
          $out = residualwatch $data --reference 3 --limit 3
          if ($LASTEXITCODE -ne 1 -or ($out | ConvertFrom-Json).first_alert_row -ne 5) { throw 'Missing residual alert' }
          $data = Join-Path (scoop prefix modelgate) 'fixtures/regression.csv'
          $out = modelgate $data --fn-cost 5
          if ($LASTEXITCODE -ne 1 -or ($out | ConvertFrom-Json).pass) { throw 'Missing release gate failure' }
          if ((blyxtorch --version) -ne 'BlyxTorch 0.2.0') { throw 'Incorrect BlyxTorch version' }
          $logo = Join-Path (scoop prefix blyxtorch) 'assets/logo.png'
          if (!(Test-Path -LiteralPath $logo -PathType Leaf)) { throw 'Missing BlyxTorch logo' }
          $queue = Join-Path (scoop prefix blyxtorch) 'projects/print-queue'
          $heldout = blyxtorch train-score (Join-Path $queue 'train.csv') (Join-Path $queue 'holdout.csv') 180 0.03 4 adam 7 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $heldout.rows -ne 6 -or $heldout.mean_loss -ge 0.01) { throw 'Print queue evaluation failed' }
          $source = blyxtorch emit 2,3 softmax relu
          if ($LASTEXITCODE -ne 0 -or !($source -match 'pub fn bt_predict')) { throw 'BlyxTorch template lookup failed' }
          $sample = Join-Path (scoop prefix blyxtorch) 'fixtures/xor.csv'
          $model = Join-Path $env:RUNNER_TEMP 'xor.bt'
          blyxtorch train $sample 250 0.03 4 adam 7 | Out-File -Encoding ascii $model
          if ($LASTEXITCODE -ne 0) { throw 'BlyxTorch training failed' }
          $report = blyxtorch score $model $sample | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $report.rows -ne 4 -or $report.mean_loss -ge 0.01) { throw 'Unexpected BlyxTorch loss' }
          exit 0
